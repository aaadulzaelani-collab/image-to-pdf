<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fast Image to PDF Converter - No Limits</title>
  <meta name="description" content="Convert JPG, PNG, and WebP images to high-quality PDF files instantly in your browser. 100% free and secure.">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsPDF Library (Client-side PDF generation) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- ========================================== -->
  <!-- 1. PASTE SCRIPT ADSTERRA / MONETAG DI SINI -->
  <!-- Contoh: Popunder script Adsterra           -->
  <!-- ========================================== -->

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur py-4 px-6 flex justify-between items-center">
    <div class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
      <span class="bg-blue-600 text-white p-1 rounded">PDF</span> MicroTools
    </div>
    <span class="text-xs font-medium text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2.5 py-1 rounded-full">
      100% Client-Side Private
    </span>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 py-12 w-full text-center">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-3">
      Convert Images to PDF
    </h1>
    <p class="text-slate-400 text-sm mb-8">
      Combine JPG, PNG, or WebP files into a single PDF document securely without uploading to any remote server.
    </p>

    <!-- Upload Card -->
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-xl">
      <label for="imageInput" class="border-2 border-dashed border-slate-600 hover:border-blue-500 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition bg-slate-900/40 group">
        <svg class="w-12 h-12 text-slate-500 group-hover:text-blue-400 mb-3 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <span class="text-sm font-semibold text-slate-200">Click to upload or drag images here</span>
        <span class="text-xs text-slate-500 mt-1">Supports PNG, JPG, JPEG, WebP</span>
        <input id="imageInput" type="file" accept="image/*" multiple class="hidden" onchange="handleFiles(this.files)" />
      </label>

      <!-- File Status Preview -->
      <div id="fileInfo" class="mt-4 hidden text-left bg-slate-900/80 border border-slate-700/50 rounded-lg p-3 text-xs text-slate-300">
        <span id="fileCount" class="font-medium text-blue-400">0</span> images selected.
      </div>

      <!-- Action Button -->
      <button id="convertBtn" onclick="processImages()" disabled class="mt-6 w-full py-3.5 px-6 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed transition shadow-lg shadow-blue-600/20">
        Convert to PDF
      </button>

      <!-- Processing & Download Box -->
      <div id="downloadSection" class="mt-6 hidden border-t border-slate-700/60 pt-6">
        <div id="countdownBox" class="text-sm text-amber-400 font-medium animate-pulse mb-3">
          Processing high-resolution PDF... (<span id="timer">3</span>s)
        </div>
        
        <div id="actionButtons" class="hidden flex flex-col sm:flex-row gap-3">
          <!-- Button 1: Download Riil File -->
          <button onclick="triggerActualDownload()" class="flex-1 py-3 px-4 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-500 transition text-sm">
            Download File (Server 1)
          </button>
          
          <!-- Button 2: Monetag SmartLink / Direct Link -->
          <button onclick="openSmartLink()" class="flex-1 py-3 px-4 rounded-xl font-semibold text-slate-200 bg-slate-700 hover:bg-slate-600 transition text-sm border border-slate-600">
            Fast Download (Mirror)
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 border-t border-slate-800 text-center text-xs text-slate-500">
    &copy; 2026 PDF MicroTools. All operations run directly in your browser.
  </footer>

  <script>
    // MASUKKAN SMARTLINK / DIRECT LINK ANDA DI SINI
    const MONETAG_SMARTLINK_URL = "https://your-monetag-smartlink.com";

    let selectedFiles = [];
    let generatedPdfBlob = null;

    function handleFiles(files) {
      if (!files.length) return;
      selectedFiles = Array.from(files);
      document.getElementById('fileCount').textContent = selectedFiles.length;
      document.getElementById('fileInfo').classList.remove('hidden');
      document.getElementById('convertBtn').disabled = false;
      document.getElementById('downloadSection').classList.add('hidden');
    }

    async function processImages() {
      if (!selectedFiles.length) return;

      const convertBtn = document.getElementById('convertBtn');
      convertBtn.disabled = true;
      convertBtn.textContent = 'Generating PDF...';

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const dataUrl = await readFileAsDataURL(file);
        
        const imgProps = pdf.getImageProperties(dataUrl);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

        if (i > 0) pdf.addPage();
        pdf.addImage(dataUrl, 'JPEG', 0, 0, pdfWidth, pdfHeight);
      }

      generatedPdfBlob = pdf.output('blob');

      // Tampilkan countdown timer
      const downloadSection = document.getElementById('downloadSection');
      const countdownBox = document.getElementById('countdownBox');
      const actionButtons = document.getElementById('actionButtons');
      const timerSpan = document.getElementById('timer');

      downloadSection.classList.remove('hidden');
      countdownBox.classList.remove('hidden');
      actionButtons.classList.add('hidden');

      let timeLeft = 3;
      timerSpan.textContent = timeLeft;

      const countdown = setInterval(() => {
        timeLeft--;
        timerSpan.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          countdownBox.classList.add('hidden');
          actionButtons.classList.remove('hidden');
          convertBtn.textContent = 'Completed';
        }
      }, 1000);
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    function triggerActualDownload() {
      if (!generatedPdfBlob) return;
      const url = URL.createObjectURL(generatedPdfBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'converted-document.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function openSmartLink() {
      // Trigger Direct Link ke tab baru
      window.open(MONETAG_SMARTLINK_URL, '_blank');
    }
  </script>
</body>
</html>
